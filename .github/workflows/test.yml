# Headless sim test suite (test/harness.mjs — Node vm, no browser, no deps).
# Runs on the fork's integration branches; the upstream Pages deploy
# (static.yml) is untouched and still keyed to the dmchurch branch.
name: Tests

on:
  push:
    branches: ["substrate", "automation", "automation-*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
